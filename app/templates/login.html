<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR File Share · Sign in</title>
  <link rel="icon" href="/static/icons/favicon-32.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#2952cc">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <div class="login-wrap">
    <form class="card login-card" method="post" action="/admin/login">
      <div class="brand">
        <img src="/static/icons/icon-192.png" alt="" width="32" height="32">
        QR File Share
      </div>
      <label for="token">Admin token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" autofocus required>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <button class="primary big" type="submit">Sign in</button>
      <p class="muted login-foot">
        The token is shown in the window that <strong>start.cmd</strong> opened, and saved in the
        <strong>.env</strong> file. You stay signed in for 12 hours.
      </p>
    </form>
  </div>
</body>
</html>
