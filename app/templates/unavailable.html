<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link unavailable</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px; box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f6f7f9; color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #16181d; color: #e8e8ea; }
      .card { background: #1f2229 !important; border-color: #2e323b !important; }
      .muted { color: #9aa0ab !important; }
    }
    .card {
      max-width: 420px; width: 100%; background: #fff; border: 1px solid #e3e5e9;
      border-radius: 12px; padding: 32px; text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 12px; font-weight: 600; }
    p { margin: 0; line-height: 1.55; }
    .muted { color: #666; font-size: 0.9rem; margin-top: 16px; }
    svg { margin-bottom: 8px; }
  </style>
</head>
<body>
  <main class="card">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle>
      <line x1="12" y1="8" x2="12" y2="13"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <h1>This link is no longer available</h1>
    <p>The document you scanned cannot be opened.</p>
    <p class="muted">Please contact your sales representative for an up-to-date link.</p>
  </main>
</body>
</html>
